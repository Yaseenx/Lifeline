<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LifeLine — Hospital Dashboard</title>
<style>
  :root{
    --bg:#eef1f6; --card:#ffffff; --soft:#f7f9fc; --line:#e8edf3; --ink:#0f172a; --muted:#64748b;
    --red:#ef4444; --blue:#3b82f6; --green:#10b981; --amber:#f59e0b; --teal:#0ea5a4;
    --shadow:0 6px 24px rgba(18,38,63,.07);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14px}
  /* top bar */
  .topbar{display:flex;align-items:center;gap:16px;padding:14px 24px;background:var(--card);
    border-bottom:1px solid var(--line);box-shadow:var(--shadow);position:sticky;top:0;z-index:20}
  .brand{font-weight:800;font-size:19px;display:flex;align-items:center;gap:8px}
  .brand .m{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#0ea5a4,#10b981);display:inline-flex;align-items:center;justify-content:center}
  .brand .m svg{width:16px;height:16px}
  .brand span{color:var(--muted);font-weight:600;font-size:14px}
  .hsel-wrap{margin-left:6px}
  select,input{font-family:inherit;font-size:14px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 12px;outline:none}
  select:focus,input:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(14,165,164,.15)}
  #hsel{font-weight:700;min-width:280px}
  .topright{margin-left:auto;display:flex;align-items:center;gap:16px}
  .clock{color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600}
  .live{font-size:12px;font-weight:800;padding:6px 11px;border-radius:999px;background:#ecfdf5;color:#0f9d6f;border:1px solid #b7f0da;display:inline-flex;gap:7px;align-items:center}
  .live.off{background:#fef2f2;color:#dc2626;border-color:#fecaca}
  .live .d{width:8px;height:8px;border-radius:50%;background:currentColor}
  .profile{display:flex;flex-direction:column;line-height:1.2}
  .profile .pn{font-weight:800;font-size:14px}.profile .pr{font-size:12px;color:var(--muted)}
  /* alert */
  .alert{margin:14px 24px 0;padding:13px 18px;border-radius:14px;background:linear-gradient(90deg,#fee2e2,#fff);
    border:1px solid #fca5a5;color:#b91c1c;font-weight:800;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow)}
  .alert .pulse{width:11px;height:11px;border-radius:50%;background:#ef4444;animation:pulse 1.1s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(239,68,68,.6)}70%{box-shadow:0 0 0 9px rgba(239,68,68,0)}100%{box-shadow:0 0 0 0 rgba(239,68,68,0)}}
  /* grid */
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;padding:18px 24px 44px;max-width:1520px;margin:0 auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 20px;box-shadow:var(--shadow)}
  .stats{grid-column:span 2}
  .card-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .card-h h3{margin:0;font-size:15px;font-weight:800}
  .card-h .muted,.chip{color:var(--muted);font-size:12px;font-weight:600}
  .chip{background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
  /* stat tiles */
  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .tile{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:15px 16px}
  .tile .l{font-size:12px;color:var(--muted);font-weight:700}
  .tile .n{font-size:30px;font-weight:800;letter-spacing:-.5px;margin-top:2px}
  .tile .sub{font-size:12px;color:var(--muted);margin-top:5px}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:middle}
  .dot.r{background:var(--red)}.dot.b{background:var(--blue)}.dot.g{background:var(--green)}
  .n.open{color:var(--green)}.n.closed{color:var(--red)}
  /* donut */
  .donutwrap{display:flex;align-items:center;justify-content:center;padding:6px 0}
  .donutlegend{display:flex;flex-direction:column;gap:8px;margin-top:10px}
  .lg{display:flex;align-items:center;justify-content:space-between;font-size:13px}
  .lg .k{color:var(--muted);font-weight:600}.lg .v{font-weight:800}
  /* beds */
  .edstate{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:12px;font-weight:800;margin-bottom:12px}
  .edstate.open{background:#ecfdf5;border:1px solid #b7f0da;color:#0f9d6f}
  .edstate.closed{background:#fef2f2;border:1px solid #fecaca;color:#dc2626}
  .wardtiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
  .ward{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:11px 13px}
  .ward .n{font-size:22px;font-weight:800}.ward .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-top:3px}
  .ward.wide{grid-column:1/3}
  .capbar{height:8px;border-radius:999px;background:#eef2f7;overflow:hidden;margin-top:8px}
  .capbar>i{display:block;height:100%;background:linear-gradient(90deg,#10b981,#0ea5a4)}
  form{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
  form .lbl{font-size:12px;color:var(--muted);font-weight:700;margin:10px 0 5px;display:block}
  form .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  form input,form select{width:100%}
  .btn{margin-top:14px;width:100%;background:linear-gradient(135deg,#0ea5a4,#10b981);color:#fff;border:none;border-radius:12px;padding:12px;font-weight:800;font-size:14px;cursor:pointer}
  .btn:hover{filter:brightness(1.05)}
  .saved{display:block;text-align:center;color:#0f9d6f;font-size:13px;font-weight:700;margin-top:9px;min-height:15px}
  /* history + route lists */
  .row-item{display:flex;align-items:center;gap:12px;padding:11px 4px;border-top:1px solid var(--line)}
  .row-item:first-child{border-top:none}
  .badge{font-size:11px;font-weight:800;padding:4px 9px;border-radius:8px;color:#fff;white-space:nowrap}
  .badge.red{background:var(--red)}.badge.blue{background:var(--blue)}
  .row-item .who{flex:1;min-width:0}
  .row-item .who .u{font-weight:800}
  .row-item .who .s{font-size:12px;color:var(--muted)}
  .stat-pill{font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;white-space:nowrap}
  .st-inbound{background:#eff6ff;color:#2563eb;border:1px solid #bfdbfe}
  .st-responding{background:#fffbeb;color:#b45309;border:1px solid #fde68a}
  .st-arrived{background:#ecfdf5;color:#0f9d6f;border:1px solid #b7f0da}
  .rt-time{font-weight:800}.rt-eta .v{font-size:20px;font-weight:800}.rt-eta .u{font-size:11px;color:var(--muted)}
  .rt-eta.resp .v{font-size:13px;color:var(--amber)}
  .tag{font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
  .empty{color:var(--muted);text-align:center;padding:26px 10px}
  @media(max-width:1080px){.grid{grid-template-columns:1fr 1fr}.stats{grid-column:span 2}}
  @media(max-width:720px){.grid{grid-template-columns:1fr}.stats{grid-column:span 1}}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand"><span class="m"><svg viewBox="0 0 24 24" fill="none"><path d="M3 12h4l2-5 3 10 2-5h7" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>LifeLine <span>Hospital</span></div>
  <div class="hsel-wrap"><select id="hsel" title="Select your hospital"></select></div>
  <div class="topright">
    <span class="clock" id="clock"></span>
    <span id="status" class="live off"><span class="d"></span>connecting</span>
    <div class="profile"><div class="pn" id="hname">—</div><div class="pr">Emergency Dept</div></div>
  </div>
</div>

<div class="alert" id="alert" style="display:none"></div>

<div class="grid">
  <!-- Row 1 -->
  <section class="card stats">
    <div class="card-h"><h3>Hospital stats</h3><span class="muted" id="statsts">live</span></div>
    <div class="tiles" id="tiles"></div>
  </section>
  <section class="card">
    <div class="card-h"><h3>ED capacity</h3></div>
    <div class="donutwrap" id="donutwrap"></div>
    <div class="donutlegend" id="donutlegend"></div>
  </section>

  <!-- Row 2 -->
  <section class="card">
    <div class="card-h"><h3>Bed availability</h3></div>
    <div id="edstate" class="edstate open"></div>
    <div class="wardtiles" id="wardtiles"></div>
    <div id="updated" class="pr" style="color:var(--muted);font-size:12px;margin-top:6px"></div>
    <form id="bedform">
      <span class="lbl">Emergency department</span>
      <select id="ed_open"><option value="true">Open — accepting</option><option value="false">Closed / on diversion</option></select>
      <div class="row">
        <div><span class="lbl">ED beds free</span><input id="beds_available" type="number" min="0" placeholder="4"></div>
        <div><span class="lbl">Total ED beds</span><input id="beds_total" type="number" min="0" placeholder="12"></div>
      </div>
      <span class="lbl">ICU beds free</span><input id="icu_available" type="number" min="0" placeholder="2">
      <span class="lbl">Note (optional)</span><input id="note" type="text" maxlength="200" placeholder="e.g. trauma bay ready">
      <button class="btn" type="submit">Update availability</button>
      <span class="saved" id="saved"></span>
    </form>
  </section>

  <section class="card">
    <div class="card-h"><h3>Emergency case history</h3><span class="muted" id="casests"></span></div>
    <div id="history"></div>
  </section>

  <section class="card">
    <div class="card-h"><h3>Ambulances on route</h3><span class="chip" id="routecount">0</span></div>
    <div id="route"></div>
    <div id="empty" class="empty">No ambulances inbound.</div>
  </section>
</div>

<script>
"use strict";
const $ = id => document.getElementById(id);
let sel = localStorage.getItem('lifeline_hospital') || '';
let formInit = false;
setInterval(()=>{ $('clock').textContent = new Date().toLocaleTimeString(); }, 1000);

const cm = c => c==='code_red' ? {cls:'red',label:'RED'} : c==='code_blue' ? {cls:'blue',label:'BLUE'} : {cls:'blue',label:(c||'—').toUpperCase()};
const val = v => (v===null||v===undefined) ? '—' : v;

function renderStats(st, b){
  st = st||{}; b = b||{};
  const ed = b.ed_open!==false;
  $('tiles').innerHTML = `
    <div class="tile"><div class="l">Inbound now</div><div class="n">${st.inbound||0}</div>
      <div class="sub"><span class="dot r"></span>${st.red||0} Code Red &nbsp; <span class="dot b"></span>${st.blue||0} Code Blue</div></div>
    <div class="tile"><div class="l">ED beds free</div><div class="n">${val(b.beds_available)}</div>
      <div class="sub">of ${val(b.beds_total)} total</div></div>
    <div class="tile"><div class="l">ICU beds free</div><div class="n">${val(b.icu_available)}</div>
      <div class="sub">intensive care</div></div>
    <div class="tile"><div class="l">ED status</div><div class="n ${ed?'open':'closed'}" style="font-size:24px">${ed?'Open':'Closed'}</div>
      <div class="sub">${ed?'accepting patients':'on diversion'}</div></div>
    <div class="tile"><div class="l">Avg inbound ETA</div><div class="n">${st.avg_eta_min!=null?st.avg_eta_min:'—'}<span style="font-size:14px"> min</span></div>
      <div class="sub">to arrival</div></div>
    <div class="tile"><div class="l">Cases today</div><div class="n">${st.cases_today||0}</div>
      <div class="sub">fleet active: ${st.active_units_total||0}</div></div>`;
}

function renderDonut(b){
  b = b||{};
  const total=b.beds_total, free=b.beds_available;
  const known = (total!=null && free!=null && total>0);
  const freePct = known ? Math.max(0,Math.min(100,Math.round(free/total*100))) : 0;
  const r=52, c=2*Math.PI*r, off=c*(1-freePct/100);
  $('donutwrap').innerHTML = `<svg viewBox="0 0 140 140" width="160" height="160">
    <circle cx="70" cy="70" r="${r}" fill="none" stroke="#eef2f7" stroke-width="16"/>
    ${known?`<circle cx="70" cy="70" r="${r}" fill="none" stroke="#10b981" stroke-width="16" stroke-linecap="round"
      stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 70 70)"/>`:''}
    <text x="70" y="66" text-anchor="middle" font-size="30" font-weight="800" fill="#0f172a">${known?free:'—'}</text>
    <text x="70" y="88" text-anchor="middle" font-size="11" fill="#64748b">${known?'beds free':'not reported'}</text></svg>`;
  const used = known ? (total-free) : null;
  $('donutlegend').innerHTML = `
    <div class="lg"><span class="k"><span class="dot g"></span>Free</span><span class="v">${val(free)}</span></div>
    <div class="lg"><span class="k"><span class="dot" style="background:#cbd5e1"></span>Occupied</span><span class="v">${val(used)}</span></div>
    <div class="lg"><span class="k">ICU free</span><span class="v">${val(b.icu_available)}</span></div>`;
}

function renderHistory(hist){
  hist = hist||[];
  $('casests').textContent = hist.length ? (hist.length+' recent') : '';
  const stp = s => s==='arrived'?'st-arrived':s==='responding'?'st-responding':'st-inbound';
  const lbl = s => s==='arrived'?'Arrived':s==='responding'?'Responding':'Inbound';
  $('history').innerHTML = hist.length ? hist.map(c=>{
    const m=cm(c.condition);
    return `<div class="row-item">
      <span class="badge ${m.cls}">${m.label}</span>
      <div class="who"><div class="u">${c.unit||'unit'}</div><div class="s">${c.house_call?'House call':'Emergency'} · ${c.time||''}</div></div>
      <span class="stat-pill ${stp(c.status)}">${lbl(c.status)}</span></div>`;
  }).join('') : '<div class="empty">No cases yet.</div>';
}

function renderRoute(list){
  list = list||[];
  $('routecount').textContent = list.length;
  $('empty').style.display = list.length ? 'none':'block';
  $('route').innerHTML = list.map(a=>{
    const m=cm(a.condition); const responding=a.phase==='responding';
    const eta = responding
      ? `<div class="rt-eta resp"><div class="v">scene</div><div class="u">responding</div></div>`
      : `<div class="rt-eta"><div class="v">${a.eta_min!=null?a.eta_min:'—'}</div><div class="u">min</div></div>`;
    return `<div class="row-item">
      <span class="badge ${m.cls}">${m.label}</span>
      <div class="who"><div class="u">${a.unit||'unit'}</div>
        <div class="s">${a.house_call?'House call':'Emergency'}${a.dist_km!=null?' · '+a.dist_km+' km':''}${a.stale?' · <span style="color:#dc2626">stale</span>':''}</div></div>
      ${eta}</div>`;
  }).join('');
}

function renderBeds(b){
  b = b||{};
  const ed = b.ed_open!==false;
  const es=$('edstate'); es.className='edstate '+(ed?'open':'closed');
  es.innerHTML = `<span>${ed?'● Emergency Dept OPEN':'● ED CLOSED / on diversion'}</span>`;
  const total=b.beds_total, free=b.beds_available;
  const pct = (total!=null&&free!=null&&total>0)? Math.round(free/total*100):0;
  $('wardtiles').innerHTML = `
    <div class="ward"><div class="n">${val(free)}</div><div class="l">ED beds free</div></div>
    <div class="ward"><div class="n">${val(b.icu_available)}</div><div class="l">ICU free</div></div>
    <div class="ward wide"><div class="l">ED capacity</div><div class="capbar"><i style="width:${pct}%"></i></div></div>`;
  $('updated').textContent = b.updated ? ('Last updated '+b.updated+(b.note?(' · '+b.note):'')) : 'Not yet reported.';
  if(!formInit){
    $('ed_open').value = ed ? 'true':'false';
    if(b.beds_available!=null)$('beds_available').value=b.beds_available;
    if(b.beds_total!=null)$('beds_total').value=b.beds_total;
    if(b.icu_available!=null)$('icu_available').value=b.icu_available;
    if(b.note)$('note').value=b.note;
    formInit=true;
  }
}

function renderAlert(list){
  const red = (list||[]).find(a=>a.condition==='code_red' && a.phase!=='responding');
  const al=$('alert');
  if(red){ al.style.display='flex'; al.innerHTML=`<span class="pulse"></span> CODE RED inbound — ${red.unit||'unit'}${red.eta_min!=null?' · ETA '+red.eta_min+' min':''}. Prepare a resus bay.`; }
  else al.style.display='none';
}

function setStatus(ok, txt){ const s=$('status'); s.className='live '+(ok?'':'off'); s.innerHTML='<span class="d"></span>'+txt; }

async function poll(){
  if(!sel) return;
  try{
    const d = await (await fetch('/hospital/state?id='+encodeURIComponent(sel))).json();
    if(d.error){ setStatus(false,d.error); return; }
    setStatus(!!d.online, d.online?('live · tick '+d.tick):'server offline');
    $('hname').textContent = d.hospital? d.hospital.name : '';
    renderStats(d.stats, d.beds); renderDonut(d.beds); renderBeds(d.beds);
    renderHistory(d.history); renderRoute(d.inbound); renderAlert(d.inbound);
  }catch(e){ setStatus(false,'reconnecting…'); }
}

const numOrNull = id => { const v=$(id).value.trim(); return v===''?null:parseInt(v,10); };
$('bedform').addEventListener('submit', async e=>{
  e.preventDefault();
  try{
    const d = await (await fetch('/hospital/beds',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({id:sel, ed_open:$('ed_open').value==='true', beds_available:numOrNull('beds_available'),
        beds_total:numOrNull('beds_total'), icu_available:numOrNull('icu_available'), note:$('note').value})})).json();
    if(d.ok){ $('saved').textContent='✓ availability updated'; renderBeds(d.beds); renderDonut(d.beds); setTimeout(()=>$('saved').textContent='',2600); }
    else $('saved').textContent=d.error||'update failed';
  }catch(_){ $('saved').textContent='update failed'; }
});
$('hsel').addEventListener('change', ()=>{ sel=$('hsel').value; localStorage.setItem('lifeline_hospital',sel); formInit=false; $('bedform').reset(); poll(); });

async function init(){
  $('clock').textContent = new Date().toLocaleTimeString();
  try{
    const d = await (await fetch('/hospitals')).json();
    const opts=(d.hospitals||[]);
    $('hsel').innerHTML = opts.map(h=>`<option value="${h.id}">${h.name}</option>`).join('');
    if(!sel || !opts.some(h=>h.id===sel)) sel = opts.length?opts[0].id:'';
    $('hsel').value = sel;
  }catch(_){ setStatus(false,'cannot load hospitals'); }
  poll(); setInterval(poll, 2000);
}
init();
</script>
</body>
</html>
